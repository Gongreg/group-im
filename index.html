<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suldu Buldu</title>
<style>
  /* Textures are the real ones from the OSRS site (see assets/). The scroll pieces
     (roll_*.png, paper_*) are cut from backdrop_765_top/bottom.gif and backdrop_745.gif,
     which are kept alongside as the source; stretching the whole art to table width
     smeared the torn ends and the deckled edges.
     Type follows oldschool.runescape.com: bold Arial, white on stone, black on parchment.
     The in-game pixel font is decorative only - it is hard to read at body sizes. */
  @font-face { font-family: 'RuneScape'; src: url(assets/runescape_bold.ttf) format('truetype'); font-weight: 700; }
  :root {
    --ink: #171004; --muted: #6a5324; --line: rgba(88,62,22,.30);
    --white: #fff; --dim: #cfc7b4; --green: #97cf46;
    --ok: #1c6a12;   --ok-bg: rgba(60,140,40,.26);
    --mid: #8a5400;  --mid-bg: rgba(200,140,20,.30);
    --no: #92200f;   --no-bg: rgba(175,55,35,.24);
    --unk: #6f6041;  --unk-bg: rgba(95,78,45,.20);
    --accent: #8f4a08;
    --bar: rgba(110,78,28,.26);
    --sum-bg: rgba(150,115,50,.20);
  }
  * { box-sizing: border-box; }
  html { background: #000; }
  body { margin: 0 auto; max-width: 1600px; padding: 0 56px; min-height: 100vh; color: var(--ink);
    font: 14px/1.45 Arial, Helvetica, sans-serif;
    /* the site's stone at native size, never stretched: vine pillars pinned to the page
       edges, and between them the stone as a mirrored tile so it repeats seamlessly;
       the page is capped so on very wide screens it sits centred on black */
    background-color: #1a160f;
    background-image: url(assets/stone_l.jpg), url(assets/stone_r.jpg), url(assets/stone_tile.jpg);
    background-repeat: repeat-y, repeat-y, repeat;
    background-position: left top, right top, left top;
  }
  /* everything sitting on the stone reads white, the way the real site does */
  header, .tabs, .controls, #status { color: var(--white); }

  /* ---- riveted stone plate: the button art from the hiscores, 9-sliced so it scales ---- */
  .chip, button {
    background: none; color: var(--white);
    font: 700 14px/1 Arial, Helvetica, sans-serif;
    text-shadow: 1px 1px 2px #000, 0 0 4px rgba(0,0,0,.8);
    border: 10px solid transparent;
    border-image: url(assets/stone_button.gif) 10 fill / 10px / 0 round;
  }

  header { padding: 20px 0 12px; display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: center; }
  h1 { font-family: 'RuneScape', Arial, sans-serif; font-size: 32px; line-height: 1;
    -webkit-font-smoothing: none; font-smooth: never;
    margin: 0; font-weight: 700; color: #ffd964; text-shadow: 2px 2px 0 #000; }
  .players { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 8px; }
  .chip .count { color: var(--green); font-weight: 700; }
  .chip.error { color: #ff9f8c; }
  .chip.stale b { color: #d9c9a8; }   /* hasn't synced in days */

  .tabs { display: flex; gap: 6px; padding: 4px 0 0; }
  .tabs button { padding: 8px 14px; color: var(--dim); }
  .tabs button:hover { color: var(--white); }
  .tabs button.active { color: #ffd964; filter: brightness(1.5) contrast(.95); }

  .controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 14px 0 8px; }
  .controls input[type=search] {
    padding: 7px 10px; min-width: 220px; font: 700 14px Arial, Helvetica, sans-serif; color: #1d1508;
    background: #efe7d2; border: 2px solid #0d0a05; border-radius: 2px;
    box-shadow: inset 0 2px 4px rgba(70,50,20,.45), 0 0 0 1px #6f6552;
  }
  .controls input[type=search]::placeholder { color: #7d7159; font-weight: 400; }
  .controls label { display: inline-flex; gap: 7px; align-items: center; cursor: pointer;
    color: var(--white); font-weight: 700; text-shadow: 1px 1px 2px #000; }
  .controls input[type=checkbox] { accent-color: #6b8f2c; width: 16px; height: 16px; }
  .controls .only-quests, .controls .only-items { display: none; }
  body.view-quests .only-quests, body.view-items .only-items { display: inline-flex; }
  body.view-stats .controls { display: none; }
  button { cursor: pointer; }
  button:hover { filter: brightness(1.3); }
  .tabs button.active:hover { filter: brightness(1.6) contrast(.95); }
  #status { padding: 2px 0 14px; color: var(--dim); text-shadow: 1px 1px 2px #000; }
  #status .err { color: #ff9f8c; font-weight: 700; }

  /* ---- the scroll the tables sit on ---- */
  /* The scroll is the OSRS site's own: backdrop_745.gif for the paper and the
     765px rolls, which overhang it by 10px a side. Cut into caps + a repeating
     middle so it holds its shape at any table width (see assets/). The torn side
     strips live on the outer box with nothing painted beneath them, so the stone
     shows through the tears; the paper tile sits on the inner box only. */
  .scroll {
    position: relative; margin: 0 10px 58px; padding: 0 40px;
    /* torn strips over the side padding; the paper tile clipped to the middle band so it
       runs the full height, under the rolls, but never behind the tears */
    background-image: url(assets/paper_l.png), url(assets/paper_r.png), url(assets/paper_m.jpg);
    background-repeat: repeat-y, repeat-y, repeat;
    background-position: left top, right top, left top;
    background-clip: border-box, border-box, content-box;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,.6));
  }
  .scroll::before, .scroll::after {
    content: ''; position: absolute; left: -10px; right: -10px; height: 50px; pointer-events: none;
    background-image: url(assets/roll_top_l.png), url(assets/roll_top_r.png), url(assets/roll_top_m.png);
    background-repeat: no-repeat, no-repeat, repeat-x;
    background-position: left top, right top, left top;
  }
  .scroll::before { top: -11px; }
  .scroll::after { bottom: -11px;
    background-image: url(assets/roll_bot_l.png), url(assets/roll_bot_r.png), url(assets/roll_bot_m.png); }
  .wrap { overflow-x: auto; padding: 47px 0 50px; }
  table { border-collapse: collapse; width: 100%; background: transparent; }
  th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; vertical-align: top; }
  td { font-weight: 600; }
  th { position: sticky; top: 0; z-index: 1; cursor: pointer; user-select: none; font-weight: 700;
    color: var(--ink); background: rgba(110,80,30,.16); letter-spacing: .2px;
    border-bottom: 2px solid rgba(70,48,14,.7); box-shadow: inset 0 1px 0 rgba(255,252,238,.5); }
  th:hover { color: var(--accent); }
  body.view-stats th[data-key=skill] { cursor: default; }
  body.view-stats th[data-key=skill]:hover { color: var(--ink); }
  th .dir { color: var(--accent); margin-left: 4px; }
  body:not(.view-quests) tbody tr:nth-child(even) td, tr.alt td { background: rgba(96,68,22,.07); }
  tr.q.has-items { cursor: pointer; }
  .reqs { margin-bottom: 4px; }
  .reqline { display: inline-block; margin-right: 14px; }
  .reqline small { color: var(--muted); }
  .tw { display: inline-block; width: 14px; color: var(--muted); font-size: 11px; }
  tr.open td { border-bottom: none; }
  tr.detail td { white-space: normal; padding: 0 10px 10px 34px; }
  tbody tr:hover td { background: rgba(255,246,206,.75); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.st, th.st { text-align: center; }
  td.wrap-cell { white-space: normal; min-width: 260px; max-width: 520px; }
  td a { color: var(--ink); text-decoration: none; }
  td a:hover { color: var(--accent); text-decoration: underline; }
  tr.mini td:first-child { color: var(--muted); }
  .mark { display: inline-block; min-width: 24px; padding: 2px 6px; border-radius: 3px;
    font-weight: 700; font-size: 13px; text-align: center; }
  .m2 { color: var(--ok); background: var(--ok-bg); }
  .m1 { color: var(--mid); background: var(--mid-bg); }
  .m0 { color: var(--no); background: var(--no-bg); }
  .mx { color: var(--unk); background: var(--unk-bg); }

  .item { display: inline; }
  .item.untradeable { color: var(--muted); }
  .item.acquired { font-style: italic; color: var(--muted); }
  .item .qty { color: var(--muted); font-weight: 400; }
  .item + .item::before { content: ", "; }

  .tag { display: inline-block; padding: 2px 8px; border-radius: 3px; font-weight: 700; }
  .keep { color: var(--ok); background: var(--ok-bg); }
  .retire { color: var(--no); background: var(--no-bg); }
  .skip { color: var(--mid); background: var(--mid-bg); }
  .untr { color: var(--unk); background: var(--unk-bg); }
  .qref { display: inline-block; margin: 1px 6px 1px 0; }
  .qref .n { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
  .qref.done { color: var(--muted); text-decoration: line-through; }
  .legend { color: var(--white); display: flex; gap: 8px 16px; flex-wrap: wrap;
    text-shadow: 1px 1px 2px #000; }
  .legend b { font-weight: 700; }
  .legend .mark, .legend .tag { text-shadow: none; background-color: #e6d8b2; }

  /* ---- tooltip: instant, html, in place of the browser's delayed title ---- */
  #tip { position: fixed; z-index: 50; max-width: 360px; padding: 6px 10px; pointer-events: none;
    background: rgba(18,14,8,.96); border: 1px solid #8f7d57; border-radius: 3px; color: #fff;
    font: 400 13px/1.5 Arial, Helvetica, sans-serif; text-align: left; white-space: normal;
    box-shadow: 0 4px 14px rgba(0,0,0,.6); }
  #tip[hidden] { display: none; }
  #tip b { color: #ffd964; }
  #tip .ok { color: #8fce3f; }
  #tip .no { color: #ff8a7a; }
  #tip .dim { color: #b7ad98; }
  #tip .icon { margin-right: 5px; }

  /* ---- stats ---- */
  .icon { width: 18px; height: 18px; object-fit: contain; image-rendering: pixelated;
    vertical-align: -4px; margin-right: 7px; }
  th .icon { margin-right: 5px; }
  td.lv, th.lv { position: relative; text-align: right; font-variant-numeric: tabular-nums; }
  /* right-anchored so each bar ends at its own number rather than the next column's */
  td.lv .bar { position: absolute; right: 0; top: 2px; bottom: 2px; background: var(--bar); border-radius: 2px 0 0 2px; }
  td.lv .v { position: relative; }
  td.lv .v.best { color: var(--ok); font-weight: 700; }
  td.lv .v.none { color: var(--unk); }
  tr.sum td { background: var(--sum-bg); }
  tr.sum td:first-child { font-weight: 700; }
  tr.sum.last td { border-bottom: 2px solid rgba(70,48,14,.7); }
  tr.sec td { background: rgba(110,80,30,.16); font-weight: 700; padding: 9px 10px 5px; border-bottom: 2px solid rgba(70,48,14,.7); }
  tr.sec small { color: var(--muted); font-weight: 400; margin-left: 8px; }
  td.lv .v.zero { color: var(--unk); font-weight: 400; }
  tr.sum:hover td { background: rgba(255,246,206,.75); }
  tr.sum[data-toggle] { cursor: pointer; }
  tr.sum.sub td { background: rgba(150,115,50,.09); }
  tr.sum.sub td:first-child { font-weight: 600; padding-left: 34px; }
  td.tiers { text-align: right; white-space: nowrap; }
  .tier { display: inline-block; min-width: 24px; margin-left: 4px; padding: 2px 3px; border-radius: 3px;
    font-size: 11px; font-weight: 700; text-align: center; color: var(--muted);
    background: linear-gradient(to right, var(--mid-bg) calc(var(--f, 0) * 100%), var(--unk-bg) 0); }
  .tier.part { color: var(--mid); }
  .tier.done { background: var(--ok-bg); color: var(--ok); }
  td.lv .frac { color: var(--muted); font-weight: 400; }
</style>
</head>
<body class="view-stats">

<header>
  <h1>Suldu Buldu</h1>
  <div class="players" id="players"></div>
</header>

<div class="tabs">
  <button data-view="stats" class="active">Stats</button>
  <button data-view="quests">Quests</button>
  <button data-view="items">Items &amp; group storage</button>
</div>

<div class="controls">
  <input type="search" id="q" placeholder="Filter by name">
  <label class="only-quests"><input type="checkbox" id="hideDone" checked> Hide quests everyone finished</label>
  <label class="only-quests"><input type="checkbox" id="showMini" checked> Include miniquests</label>
  <label class="only-items"><input type="checkbox" id="tradeableOnly" checked> Tradeable only</label>
  <label class="only-items"><input type="checkbox" id="hideRetired"> Hide retired</label>
  <span class="legend only-quests">
    <span><span class="mark m2">✓</span> done</span>
    <span><span class="mark m1">◐</span> in progress</span>
    <span><span class="mark m0">✗</span> not started</span>
    <span><span class="mark m0">3</span> not started, 3 skills short (hover for which)</span>
    <span><span class="mark mx">–</span> no data</span>
  </span>
  <span class="legend only-items">
    <span><span class="tag keep">Keep</span> a pending quest still needs it</span>
    <span><span class="tag skip">Skip</span> only needed where it's found in-quest</span>
    <span><span class="tag retire">Retire</span> every quest needing it is done by all</span>
    <span><span class="tag untr">Untradeable</span> can't go in group storage</span>
  </span>
</div>

<div id="status">Loading…</div>

<div class="scroll">
  <div class="wrap">
    <table id="table"></table>
  </div>
</div>

<div id="tip" hidden></div>

<!-- Generated by fetch_data.py -->
<script src="data.js"></script>
<script>
// ---------- config ----------
const PLAYERS = ['gaudyk', 'uncle sacks', 'Moms klit', 'knysliukas', 'cluescrollas'];
// a word or two of flair on each player's chip; the story sits in the tooltip
const FLAIR = {
  'gaudyk': ['Beaver dad', 'Got a beaver pet at level 40'],
  'uncle sacks': ['Breadwinner', 'Pulled a stale baguette out of a mystery box - one of the rarest collection log items'],
  'Moms klit': ['Beef mom', 'Has the beef pet'],
  'knysliukas': ['Sailor moon', 'The only one with Sailing - commanding a raft'],
  'cluescrollas': ['Just vibes', 'Nothing yet'],
};
const WIKI_BASE = 'https://oldschool.runescape.wiki';
const DIFFICULTY = ['Novice', 'Intermediate', 'Experienced', 'Master', 'Grandmaster', 'Special'];
const LENGTH = ['Very Short', 'Short', 'Medium', 'Long', 'Very Long'];

// ---------- state ----------
const state = {
  view: 'stats',
  quests: [],        // { name, url, type, members, difficulty, length, qp, series, release, items: [] }
  items: [],         // { name, page, reusable, total, tradeable, needed: [{ page, qty, acquired, quest }] }
  players: {},       // name -> { status, quests: { normName -> 0|1|2 }, skills: { skill -> { level, xp } }, raw }
  skills: [],        // ordered skill names present in the data
  sort: { quests: { key: 'done', dir: -1 }, items: { key: 'status', dir: 1 }, stats: { key: 'skill', dir: 1 } },
  expanded: new Set(),  // quest pages whose item list is open
  open: {},             // expandable summary rows on the stats tab, by key
  filter: { q: '', hideDone: true, showMini: true, tradeableOnly: true, hideRetired: false },
};

const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');
const slug = s => s.replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '');
const icon = (name, alt) =>
  `<img class="icon" src="assets/icons/${esc(slug(name))}.png" alt="${esc(alt == null ? name : alt)}" onerror="this.remove()">`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const wikiUrl = title => `${WIKI_BASE}/w/${encodeURIComponent(title.replace(/ /g, '_'))}`;
const tipAttr = html => html ? ` data-tip="${esc(html)}"` : '';  // html tooltip, see the tooltip section

// ---------- parsing ----------
function parseQuestHtml(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const quests = [];
  let questTables = 0;
  for (const table of doc.querySelectorAll('table.wikitable')) {
    const rows = [...table.querySelectorAll('tr')];
    if (!rows.length) continue;
    const headCells = [...rows[0].children];
    const heads = headCells.map(th => th.textContent.trim());
    const col = label => heads.findIndex(h => h.toLowerCase().startsWith(label.toLowerCase()));
    const iName = col('Name');
    if (iName < 0) continue;
    const iDiff = col('Difficulty'), iLen = col('Length'), iSeries = col('Series'), iRel = col('Release');
    const iQp = headCells.findIndex(th => th.querySelector('img[alt*="Quest point" i], a[title="Quest points"]'));
    const isQuest = col('#') === 0;
    const members = isQuest ? questTables++ > 0 : true;
    for (const tr of rows.slice(1)) {
      const td = [...tr.children];
      if (td.length <= iName) continue;
      const link = td[iName].querySelector('a');
      const name = td[iName].textContent.trim();
      if (!name) continue;
      quests.push({
        name,
        page: link ? (link.getAttribute('title') || name) : name,
        url: link ? WIKI_BASE + link.getAttribute('href') : '',
        type: isQuest ? 'quest' : 'miniquest',
        members,
        difficulty: iDiff >= 0 ? td[iDiff].textContent.trim() : '',
        length: iLen >= 0 ? td[iLen].textContent.trim() : '',
        qp: iQp >= 0 ? parseInt(td[iQp].textContent.trim(), 10) || 0 : 0,
        series: iSeries >= 0 ? td[iSeries].textContent.trim() : '',
        release: iRel >= 0 ? td[iRel].textContent.trim() : '',
        items: [],
      });
    }
  }
  if (!quests.length) throw new Error('No quest tables found on the wiki page (layout changed?)');
  return quests;
}

// link items <-> quests by page title
function linkItems() {
  const byPage = new Map(state.quests.map(q => [norm(q.page), q]));
  for (const item of state.items) {
    for (const need of item.needed) {
      const quest = byPage.get(norm(need.page));
      need.quest = quest || null;
      if (quest) quest.items.push({ item, qty: need.qty, acquired: need.acquired });
    }
  }
}

function ingestPlayer(name, sync, stats) {
  const rec = { status: 'error', error: 'No WikiSync data for this player', quests: {}, raw: sync, skills: null, overall: null, activities: null, synced: null };
  if (sync && sync.quests) {
    rec.status = 'ok';
    rec.error = '';
    rec.synced = sync.timestamp ? new Date(sync.timestamp) : null;  // their last login with the plugin
    for (const [k, v] of Object.entries(sync.quests)) rec.quests[norm(k)] = v;
  }
  // Hiscores are live; WikiSync levels are only as fresh as the last plugin login.
  if (stats && stats.skills) {
    rec.skills = stats.skills;
    rec.overall = stats.overall || null;
    rec.activities = stats.activities || null;
  } else if (sync && sync.levels) {
    rec.skills = Object.fromEntries(Object.entries(sync.levels).map(([k, v]) => [k, { level: v, xp: null }]));
  }
  state.players[name] = rec;
}

// ---------- derived values ----------
function questStatus(quest, playerName) {
  const p = state.players[playerName];
  if (!p || p.status !== 'ok') return -1;
  const v = p.quests[norm(quest.name)];
  return v === undefined ? -1 : v;
}
function doneCount(quest) {
  return PLAYERS.reduce((n, p) => n + (questStatus(quest, p) === 2 ? 1 : 0), 0);
}
function questPending(quest) { return doneCount(quest) < PLAYERS.length; }

function questPoints(p) {
  return state.quests.reduce((n, q) => n + (q.type === 'quest' && questStatus(q, p) === 2 ? q.qp : 0), 0);
}
// the player's level for a requirement; "Quest" means quest points, "Combat" combat level
function levelFor(p, skill) {
  const r = state.players[p];
  if (!r.skills) return null;
  if (skill === 'Quest') return r.status === 'ok' ? questPoints(p) : null;
  if (skill.includes('+')) {  // e.g. Attack+Strength for the Warriors' Guild
    const parts = skill.split('+').map(k => levelFor(p, k));
    return parts.some(v => v == null) ? null : parts.reduce((a, b) => a + b, 0);
  }
  if (skill === 'Combat') return combatLevel(r.skills);
  const s = r.skills[skill];
  return s ? s.level : null;
}
// a quest's requirements for one player, grouped: an "or" line is one group
// that counts as met if any option is. null = can't tell (no skill data).
function reqGroups(quest, p) {
  if (!quest.reqs.length || !state.players[p].skills) return null;
  const groups = new Map();
  for (const r of quest.reqs) {
    const key = 'or' in r ? 'or' + r.or : r.skill + r.level;
    const has = levelFor(p, r.skill);
    const g = groups.get(key) || { reqs: [], met: false };
    g.reqs.push({ ...r, has }); g.met = g.met || (has != null && has >= r.level);
    groups.set(key, g);
  }
  return [...groups.values()];
}
const missingReqs = (quest, p) => { const g = reqGroups(quest, p); return g && g.filter(x => !x.met); };
const groupHtml = g => g.reqs.map(r =>
  `${icon(r.skill === 'Quest' ? 'Quest point' : r.skill, '')}${esc(reqLabel(r))} <span class="dim">(has ${r.has ?? '?'})</span>`).join(' or ');
const reqLabel = r => (r.skill === 'Quest' ? 'Quest points' : r.skill.replace('+', ' + ')) + ' ' + r.level + (r.boostable ? ' (boostable)' : '');

// storage advice for an item
function itemStatus(item) {
  const uses = item.needed.filter(n => n.quest);
  const pending = uses.filter(n => questPending(n.quest));
  const worth = pending.filter(n => !n.acquired);
  const playersNeeding = new Set();
  for (const n of worth) for (const p of PLAYERS) if (questStatus(n.quest, p) !== 2) playersNeeding.add(p);
  if (item.tradeable === false) return { code: 'untr', label: 'Untradeable', rank: 3, pending: worth.length, players: playersNeeding.size };
  if (!pending.length) return { code: 'retire', label: 'Retire', rank: 2, pending: 0, players: 0 };
  if (!worth.length) return { code: 'skip', label: 'Skip', rank: 1, pending: 0, players: 0 };
  // name the players when it is down to one or two of them
  const who = [...playersNeeding];
  const whoLabel = who.length <= 2 ? who.join(' & ') : `${who.length} players`;
  return { code: 'keep', label: `Keep · ${worth.length} quest${worth.length > 1 ? 's' : ''} · ${whoLabel}`, rank: 0, pending: worth.length, players: who.length, who };
}

// ---------- rendering ----------
// "3 h ago", "2 days ago" - how old a player's WikiSync snapshot is
function ago(date) {
  const m = Math.round((Date.now() - date) / 60000);
  if (m < 2) return 'just now';
  if (m < 60) return `${m} min ago`;
  if (m < 48 * 60) return `${Math.round(m / 60)} h ago`;
  return `${Math.round(m / 1440)} days ago`;
}
const STALE_AFTER = 3 * 24 * 60 * 60 * 1000;  // quests and diaries come from the last plugin login; flag old ones

function renderPlayers() {
  document.getElementById('players').innerHTML = PLAYERS.map(name => {
    const p = state.players[name] || {};
    const [flair, story] = FLAIR[name] || ['', ''];
    const stale = p.synced && Date.now() - p.synced > STALE_AFTER;
    const cls = 'chip' + (p.status === 'error' ? ' error' : stale ? ' stale' : '');
    const sync = p.synced
      ? `<span class="dim">WikiSync ${ago(p.synced)} (${p.synced.toLocaleString()})${stale ? ' - quests and diaries may be behind' : ''}</span>`
      : p.error ? `<span class="dim">${esc(p.error)}</span>` : '';
    return `<span class="${cls}"${tipAttr([story ? esc(story) : '', sync].filter(Boolean).join('<br>'))}><b>${esc(name)}</b><span class="count">${esc(flair)}</span></span>`;
  }).join('');
}

const MARK = { 2: ['m2', '✓', 'Completed'], 1: ['m1', '◐', 'In progress'], 0: ['m0', '✗', 'Not started'], '-1': ['mx', '–', 'No data'] };

const QUEST_COLUMNS = [
  { key: 'name', label: 'Quest' },
  { key: 'difficulty', label: 'Difficulty' },
  { key: 'length', label: 'Length' },
  { key: 'qp', label: 'QP', cls: 'num', ico: 'Quest point' },
  { key: 'done', label: 'Done by', cls: 'num' },
  ...PLAYERS.map((p, i) => ({ key: 'p' + i, label: p, cls: 'st' })),
  { key: 'items', label: 'Items', cls: 'num' },
];

function questSortValue(q, key) {
  switch (key) {
    case 'name': return q.name.toLowerCase();
    case 'difficulty': return DIFFICULTY.indexOf(q.difficulty);
    case 'length': return LENGTH.indexOf(q.length);
    case 'qp': return q.qp;
    case 'done': return doneCount(q);
    case 'items': return q.items.length;
    default: return questStatus(q, PLAYERS[+key.slice(1)]);
  }
}

function renderItemInline(entry) {
  const { item, qty, acquired } = entry;
  const cls = ['item', item.tradeable === false ? 'untradeable' : '', acquired ? 'acquired' : ''].join(' ');
  const title = [item.tradeable === false ? 'Untradeable' : item.tradeable ? 'Tradeable' : 'Tradeability unknown',
    item.reusable ? 'reusable' : '', acquired ? 'obtained during quest' : ''].filter(Boolean).join(', ');
  return `<span class="${cls}"${tipAttr(esc(title))}><a href="${esc(wikiUrl(item.page))}" target="_blank" rel="noopener">${esc(item.name)}</a>${qty ? `<span class="qty"> ×${qty.toLocaleString()}</span>` : ''}</span>`;
}

function renderQuests() {
  const { key, dir } = state.sort.quests;
  const { q, hideDone, showMini } = state.filter;
  const needle = q.trim().toLowerCase();
  const list = state.quests.filter(x =>
    (showMini || x.type === 'quest') &&
    (!needle || x.name.toLowerCase().includes(needle) || x.items.some(e => e.item.name.toLowerCase().includes(needle))) &&
    (!hideDone || questPending(x))
  ).sort((a, b) => {
    const va = questSortValue(a, key), vb = questSortValue(b, key);
    let c = va < vb ? -1 : va > vb ? 1 : 0;
    if (c === 0 && key !== 'done') c = doneCount(b) - doneCount(a);
    if (c === 0) c = a.name.localeCompare(b.name);
    return c * dir;
  });

  const head = QUEST_COLUMNS.map(c =>
    `<th class="${c.cls || ''}" data-key="${c.key}">${c.ico ? icon(c.ico, '') : ''}${esc(c.label)}${c.key === key ? `<span class="dir">${dir > 0 ? '▲' : '▼'}</span>` : ''}</th>`).join('');

  const rows = list.map((qst, i) => {
    const done = doneCount(qst);
    const cells = PLAYERS.map(p => {
      const st = questStatus(qst, p);
      let [cls, sym, title] = MARK[st];
      let tip = `<b>${title}</b>`;
      const groups = st === 2 ? null : reqGroups(qst, p);
      if (groups) {
        const missing = groups.filter(g => !g.met);
        if (missing.length) sym = String(missing.length);
        tip += missing.length ? ` · ${missing.length} skill${missing.length > 1 ? 's' : ''} short` : ' · has the skill levels';
        tip += groups.map(g => `<br>${g.met ? '<span class="ok">✓</span>' : '<span class="no">✗</span>'} ${groupHtml(g)}`).join('');
      }
      return `<td class="st"><span class="mark ${cls}"${tipAttr(tip)}>${sym}</span></td>`;
    }).join('');
    const open = state.expanded.has(qst.page);
    const rowCls = ['q', i % 2 ? 'alt' : '', qst.type === 'miniquest' ? 'mini' : '', done === PLAYERS.length ? 'all-done' : '',
      qst.items.length || qst.reqs.length ? 'has-items' : '', open ? 'open' : ''].filter(Boolean).join(' ');
    const nameCell = qst.url ? `<a href="${esc(qst.url)}" target="_blank" rel="noopener">${esc(qst.name)}</a>` : esc(qst.name);
    const items = [...qst.items].sort((a, b) => (a.acquired - b.acquired) || a.item.name.localeCompare(b.item.name));
    return `<tr class="${rowCls}" data-q="${esc(qst.page)}">
      <td><span class="tw">${qst.items.length || qst.reqs.length ? (open ? '▾' : '▸') : ''}</span>${nameCell}${qst.type === 'miniquest' ? ' <small>(miniquest)</small>' : ''}</td>
      <td>${esc(qst.difficulty)}</td>
      <td>${esc(qst.length)}</td>
      <td class="num">${qst.type === 'quest' ? qst.qp : ''}</td>
      <td class="num">${done}/${PLAYERS.length}</td>
      ${cells}
      <td class="num">${qst.items.length || '–'}</td>
    </tr>` + (open ? `<tr class="detail${i % 2 ? ' alt' : ''}"><td colspan="${QUEST_COLUMNS.length}">${
        qst.reqs.length ? `<div class="reqs">${qst.reqs.map(r => `<span class="reqline">${icon(r.skill === 'Quest' ? 'Quest point' : r.skill, '')}${esc(reqLabel(r))}${'or' in r ? ' <small>(either)</small>' : ''}</span>`).join('')}</div>` : ''
      }${items.map(renderItemInline).join('') || '<span class="item untradeable">no items</span>'}</td></tr>` : '');
  }).join('');

  document.getElementById('table').innerHTML = `<thead><tr>${head}</tr></thead><tbody>${rows}</tbody>`;
}

const ITEM_COLUMNS = [
  { key: 'name', label: 'Item' },
  { key: 'status', label: 'Group storage' },
  { key: 'tradeable', label: 'Tradeable', cls: 'st' },
  { key: 'reusable', label: 'Reusable', cls: 'st' },
  { key: 'total', label: 'Total qty', cls: 'num' },
  { key: 'needed', label: 'Needed for (done by)', cls: 'wrap-cell' },
];

function itemSortValue(it, key, st) {
  switch (key) {
    case 'name': return it.name.toLowerCase();
    case 'status': return st.rank * 1e6 + st.players * 1e3 + st.pending;
    case 'tradeable': return it.tradeable === true ? 0 : it.tradeable === null ? 1 : 2;
    case 'reusable': return it.reusable ? 0 : 1;
    case 'total': return it.total || 0;
    case 'needed': return it.needed.length;
  }
}

function renderItems() {
  const { key, dir } = state.sort.items;
  const { q, tradeableOnly, hideRetired } = state.filter;
  const needle = q.trim().toLowerCase();
  const list = state.items.map(it => ({ it, st: itemStatus(it) })).filter(({ it, st }) =>
    (!tradeableOnly || it.tradeable !== false) &&
    (!hideRetired || st.code === 'keep') &&
    (!needle || it.name.toLowerCase().includes(needle) || it.needed.some(n => n.page.toLowerCase().includes(needle)))
  ).sort((a, b) => {
    const va = itemSortValue(a.it, key, a.st), vb = itemSortValue(b.it, key, b.st);
    let c = va < vb ? -1 : va > vb ? 1 : 0;
    if (c === 0) c = a.it.name.localeCompare(b.it.name);
    return c * dir;
  });

  const head = ITEM_COLUMNS.map(c =>
    `<th class="${c.cls || ''}" data-key="${c.key}">${esc(c.label)}${c.key === key ? `<span class="dir">${dir > 0 ? '▲' : '▼'}</span>` : ''}</th>`).join('');

  const rows = list.map(({ it, st }) => {
    const needed = it.needed.map(n => {
      const done = n.quest ? doneCount(n.quest) : null;
      const cls = 'qref' + (n.quest && !questPending(n.quest) ? ' done' : '');
      const label = n.quest ? n.quest.name : n.page;
      const extra = [n.qty ? `×${n.qty.toLocaleString()}` : '', n.acquired ? 'in-quest' : ''].filter(Boolean).join(', ');
      return `<span class="${cls}"${tipAttr(n.acquired ? 'Obtained during the quest' : '')}><a href="${esc(wikiUrl(n.page))}" target="_blank" rel="noopener">${esc(label)}</a> <span class="n">${done === null ? '?' : done + '/' + PLAYERS.length}${extra ? ', ' + esc(extra) : ''}</span></span>`;
    }).join('');
    const tr = it.tradeable === true ? '<span class="mark m2">✓</span>' : it.tradeable === false ? '<span class="mark m0">✗</span>' : '<span class="mark mx">?</span>';
    return `<tr>
      <td><a href="${esc(wikiUrl(it.page))}" target="_blank" rel="noopener">${esc(it.name)}</a></td>
      <td><span class="tag ${st.code}"${tipAttr(st.who && st.who.length > 2 ? 'Still needed by ' + st.who.map(esc).join(', ') : '')}>${esc(st.label)}</span></td>
      <td class="st">${tr}</td>
      <td class="st">${it.reusable ? '<span class="mark m2">✓</span>' : ''}</td>
      <td class="num">${it.total == null ? '' : it.total.toLocaleString()}</td>
      <td class="wrap-cell">${needed}</td>
    </tr>`;
  }).join('');

  document.getElementById('table').innerHTML = `<thead><tr>${head}</tr></thead><tbody>${rows}</tbody>`;
}

// ---------- stats ----------
const SKILL_ORDER = ['Attack', 'Hitpoints', 'Mining', 'Strength', 'Agility', 'Smithing',
  'Defence', 'Herblore', 'Fishing', 'Ranged', 'Thieving', 'Cooking', 'Prayer', 'Crafting',
  'Firemaking', 'Magic', 'Fletching', 'Woodcutting', 'Runecraft', 'Slayer', 'Farming',
  'Construction', 'Hunter', 'Sailing'];
const MAX_LEVEL = 99;

const fmtXp = n => n == null ? '–'
  : n >= 1e6 ? (n / 1e6).toFixed(2) + 'M'
  : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k'
  : n.toLocaleString();

function collectSkills() {
  const seen = new Set();
  for (const p of PLAYERS) {
    const s = state.players[p].skills;
    if (s) for (const k of Object.keys(s)) seen.add(k);
  }
  return [...SKILL_ORDER.filter(k => seen.has(k)), ...[...seen].filter(k => !SKILL_ORDER.includes(k)).sort()];
}

const skillOf = (player, skill) => (state.players[player].skills || {})[skill] || null;

function combatLevel(skills) {
  const g = k => (skills[k] ? skills[k].level : 1);
  const base = 0.25 * (g('Defence') + g('Hitpoints') + Math.floor(g('Prayer') / 2));
  const melee = 0.325 * (g('Attack') + g('Strength'));
  const ranged = 0.325 * Math.floor(g('Ranged') * 1.5);
  const magic = 0.325 * Math.floor(g('Magic') * 1.5);
  return Math.floor(base + Math.max(melee, ranged, magic));
}

// one summary row per stat; a cell is null (no data) or { v, text, title?, frac?, max? }
function summaryRows() {
  const quests = state.quests.filter(q => q.type === 'quest');
  const totalQp = quests.reduce((n, q) => n + q.qp, 0);
  const caTotal = (window.QUEST_DATA || {}).caTotal;
  const frac = (done, total) => ({ v: done, text: done.toLocaleString(), frac: '/' + total.toLocaleString(), max: total });
  const rows = [];
  const add = (label, fn, opts) => rows.push({ label, ...opts, cells: PLAYERS.map(fn) });

  add('Total level', p => {
    const r = state.players[p];
    if (!r.skills) return null;
    const v = r.overall ? r.overall.level : Object.values(r.skills).reduce((n, s) => n + s.level, 0);
    return { v, text: v.toLocaleString(), max: state.skills.length * MAX_LEVEL };
  });
  add('Total XP', p => {
    const r = state.players[p];
    if (!r.skills) return null;
    const known = Object.values(r.skills).filter(s => s.xp != null);
    const v = r.overall ? r.overall.xp : known.length ? known.reduce((n, s) => n + s.xp, 0) : null;
    return v == null ? null : { v, text: fmtXp(v), title: v.toLocaleString() + ' xp' };
  });
  add('Combat level', p => {
    const r = state.players[p];
    return r.skills ? { v: combatLevel(r.skills), text: String(combatLevel(r.skills)), max: 126 } : null;
  });
  add('Quests', p => {
    if (state.players[p].status !== 'ok') return null;
    return frac(quests.filter(q => questStatus(q, p) === 2).length, quests.length);
  });
  add('Quest points', p => {
    if (state.players[p].status !== 'ok') return null;
    return frac(quests.reduce((n, q) => n + (questStatus(q, p) === 2 ? q.qp : 0), 0), totalQp);
  }, { ico: 'Quest point' });
  add('Diary tiers', p => {
    const d = (state.players[p].raw || {}).achievement_diaries;
    if (!d) return null;
    let done = 0, total = 0;
    for (const region of Object.values(d)) for (const tier of Object.values(region)) { total++; if (tier.complete) done++; }
    return frac(done, total);
  }, { note: 'complete tiers across all 12 regions - click for each region', toggle: 'diaries', expand: diaryRows });
  add('Combat achievements', p => {
    const c = (state.players[p].raw || {}).combat_achievements;
    if (!Array.isArray(c)) return null;
    return caTotal ? frac(c.length, caTotal) : { v: c.length, text: c.length.toLocaleString() };
  });
  add('Music tracks', p => {
    const m = (state.players[p].raw || {}).music_tracks;
    if (!m) return null;
    const vals = Object.values(m);
    return frac(vals.filter(Boolean).length, vals.length);
  });
  return rows;
}

// one row per diary region: each player's four tiers as chips that fill with task progress
const TIERS = ['Easy', 'Medium', 'Hard', 'Elite'];
function diaryRows() {
  const regions = [];
  for (const p of PLAYERS) for (const r of Object.keys((state.players[p].raw || {}).achievement_diaries || {})) if (!regions.includes(r)) regions.push(r);
  return regions.map(region => `<tr class="sum sub"><td><a href="${esc(wikiUrl(region + ' Diary'))}" target="_blank" rel="noopener">${esc(region)}</a></td>`
    + PLAYERS.map(p => {
      const d = ((state.players[p].raw || {}).achievement_diaries || {})[region];
      if (!d) return '<td class="tiers"><span class="v none">–</span></td>';
      return '<td class="tiers">' + TIERS.map(t => {
        const tier = d[t];
        if (!tier) return '';
        const done = tier.tasks.filter(Boolean).length, total = tier.tasks.length;
        const cls = tier.complete ? 'done' : done ? 'part' : 'none';
        return `<span class="tier ${cls}" style="--f:${total ? done / total : 0}"${tipAttr(`<b>${t}</b> ${done}/${total} tasks${tier.complete ? ' · complete' : ''}`)}>${t === 'Elite' ? 'El' : t[0]}</span>`;
      }).join('') + '</td>';
    }).join('') + '</tr>').join('');
}

const STATS_COLUMNS = [
  { key: 'skill', label: 'General' },  // not sortable; a third click on any other column returns to this order
  ...PLAYERS.map((p, i) => ({ key: 'p' + i, label: p, cls: 'lv' })),
];

// one row of the table: a label and per-player values (null = no data); low/high pick out the leader
function metricRow(label, values, opts) {
  const nums = values.filter(n => n != null);
  const low = nums.length ? Math.min(...nums) : null;
  const high = nums.length ? Math.max(...nums) : null;
  return { label, values, low, high, order: 0, max: null, titles: [], link: '', ...opts };
}

function skillRows() {
  return state.skills.map(skill => {
    const cells = PLAYERS.map(p => skillOf(p, skill));
    return metricRow(skill, cells.map(c => c && c.level), {
      icon: skill, link: wikiUrl(skill), max: MAX_LEVEL, order: SKILL_ORDER.indexOf(skill) + 1 || 999,
      titles: cells.map(c => c ? `<b>Level ${c.level}</b>${c.xp == null ? '' : '<br>' + c.xp.toLocaleString() + ' xp'}` : ''),
    });
  });
}

// hiscores activities in the order the site lists them: clue tiers, minigames, then bosses
function activityRows() {
  const names = [];
  for (const p of PLAYERS) for (const k of Object.keys(state.players[p].activities || {})) if (!names.includes(k)) names.push(k);
  return names
    .filter(n => !n.endsWith(' - Rank'))  // PvP Arena / LMS ratings, not amounts
    .map((name, i) => metricRow(name, PLAYERS.map(p => {
      const a = state.players[p].activities;
      return a && a[name] != null && a[name] >= 0 ? a[name] : null;
    }), { icon: name, order: i + 1 }));
}

// sections of the table below the summary: [title, rows, hideEmpty]
function statsSections() {
  const acts = activityRows();
  const firstBoss = acts.findIndex(r => r.label === 'Abyssal Sire');
  const bosses = firstBoss < 0 ? [] : acts.slice(firstBoss);
  const clues = acts.filter(r => r.label.startsWith('Clue Scrolls'));
  const other = acts.filter(r => !bosses.includes(r) && !clues.includes(r));
  return [['Skills', skillRows(), false], ['Clue scrolls', clues, false], ['Bosses', bosses, true], ['Minigames & other', other, true]];
}

function statsSortValue(row, key) {
  switch (key) {
    case 'skill': return row.order;
    default: { const v = row.values[+key.slice(1)]; return v == null ? -1 : v; }
  }
}

function renderStats() {
  const { key, dir } = state.sort.stats;
  const compare = (a, b) => {
    const va = statsSortValue(a, key), vb = statsSortValue(b, key);
    let c = va < vb ? -1 : va > vb ? 1 : 0;
    if (c === 0) c = a.label.localeCompare(b.label);
    return c * dir;
  };

  const head = STATS_COLUMNS.map(c =>
    `<th class="${c.cls || ''}" data-key="${c.key}">${esc(c.label)}${c.key === key && c.key !== 'skill' ? `<span class="dir">${dir > 0 ? '▲' : '▼'}</span>` : ''}</th>`).join('');

  // shared cell renderer: a background bar plus the number
  const cell = ({ v, text, title, frac, max, best, zero }) => {
    const pct = max ? Math.max(0, Math.min(100, (v / max) * 100)) : 0;
    return `<td class="lv"${tipAttr(title)}>`
      + (pct ? `<span class="bar" style="width:${pct.toFixed(1)}%"></span>` : '')
      + `<span class="v${best ? ' best' : ''}${zero ? ' zero' : ''}">${esc(text)}${frac ? `<span class="frac">${esc(frac)}</span>` : ''}</span></td>`;
  };
  const blank = '<td class="lv"><span class="v none">–</span></td>';

  const sums = summaryRows();
  const summary = sums.map((row, i) => {
    const vals = row.cells.filter(Boolean).map(c => c.v);
    const high = vals.length ? Math.max(...vals) : null;
    const low = vals.length ? Math.min(...vals) : null;
    const lead = vals.length > 1 && low !== high;
    // bars only where there is a real ceiling (total XP has none, so it gets no bar)
    const open = row.toggle && state.open[row.toggle];
    return `<tr class="sum${i === sums.length - 1 ? ' last' : ''}"${row.toggle ? ` data-toggle="${row.toggle}"` : ''}><td${tipAttr(row.note ? esc(row.note) : '')}>`
      + (row.toggle ? `<span class="tw">${open ? '▾' : '▸'}</span>` : '')
      + (row.ico ? icon(row.ico, '') : '') + `${esc(row.label)}</td>`
      + row.cells.map(c => c ? cell({ ...c, best: lead && c.v === high }) : blank).join('')
      + '</tr>' + (open ? row.expand() : '');
  }).join('');

  const body = statsSections().map(([title, all, hideEmpty]) => {
    const rows = (hideEmpty ? all.filter(r => r.high > 0) : all).sort(compare);
    const note = hideEmpty ? ` <small>${rows.length} of ${all.length} with any count</small>` : '';
    if (!all.length) return '';
    return `<tr class="sec"><td colspan="${STATS_COLUMNS.length}">${esc(title)}${note}</td></tr>` + rows.map(r => {
      const best = r.high != null && r.low !== r.high;
      const name = r.link ? `<a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.label)}</a>` : esc(r.label);
      return `<tr><td>${icon(r.icon)}${name}</td>`
        + r.values.map((v, i) => v == null ? blank
          : cell({ v, max: r.max, best: best && v === r.high, zero: v === 0, text: v.toLocaleString(), title: r.titles[i] || '' })).join('')
        + '</tr>';
    }).join('');
  }).join('');

  document.getElementById('table').innerHTML = `<thead><tr>${head}</tr></thead><tbody>${summary}${body}</tbody>`;
}

function render() {
  if (state.view === 'quests') renderQuests();
  else if (state.view === 'items') renderItems();
  else renderStats();
}

function setStatus(msg, isError) {
  document.getElementById('status').innerHTML = isError ? `<span class="err">${esc(msg)}</span>` : esc(msg);
}

// ---------- tooltip ----------
const tipEl = document.getElementById('tip');
let tipFor = null;
function showTip(el) {
  tipFor = el;
  tipEl.innerHTML = el.dataset.tip;
  tipEl.hidden = false;
  const r = el.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  const x = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 8));
  const y = r.bottom + 8 + h > innerHeight - 8 ? r.top - h - 8 : r.bottom + 8;  // below, or above if there's no room
  tipEl.style.left = x + 'px';
  tipEl.style.top = y + 'px';
}
function hideTip() { tipFor = null; tipEl.hidden = true; }
document.addEventListener('mouseover', e => {
  const el = e.target.closest('[data-tip]');
  if (el && el !== tipFor) showTip(el);
  else if (!el && tipFor) hideTip();
});
document.addEventListener('mouseout', e => { if (tipFor && !tipFor.contains(e.relatedTarget)) hideTip(); });
addEventListener('scroll', hideTip, true);
document.addEventListener('click', hideTip);

// ---------- events ----------
document.getElementById('table').addEventListener('click', e => {
  const row = e.target.closest('tr.q.has-items');
  if (row && !e.target.closest('a')) {
    const k = row.dataset.q;
    state.expanded.has(k) ? state.expanded.delete(k) : state.expanded.add(k);
    render();
    return;
  }
  const sumRow = e.target.closest('tr.sum[data-toggle]');
  if (sumRow && !e.target.closest('a')) {
    state.open[sumRow.dataset.toggle] = !state.open[sumRow.dataset.toggle];
    render();
    return;
  }
  const th = e.target.closest('th');
  if (!th) return;
  const key = th.dataset.key;
  if (state.view === 'stats' && key === 'skill') return;  // "General" is a label, not a sort
  const s = state.sort[state.view];
  const first = ['name', 'difficulty', 'length', 'status', 'tradeable', 'reusable'].includes(key) ? 1 : -1;
  if (s.key !== key) { s.key = key; s.dir = first; }
  else if (state.view === 'stats' && s.dir === -first) { s.key = 'skill'; s.dir = 1; }  // third click: back to in-game order
  else s.dir *= -1;
  render();
});
// the chosen tab survives a refresh
function setView(view) {
  const b = document.querySelector(`.tabs button[data-view="${view}"]`);
  if (!b) return;
  state.view = view;
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('active', x === b));
  document.body.className = 'view-' + view;
  try { localStorage.setItem('view', view); } catch (e) { /* storage blocked; the tab still switches */ }
}
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) { setView(b.dataset.view); render(); }
});
document.getElementById('q').addEventListener('input', e => { state.filter.q = e.target.value; render(); });
for (const id of ['hideDone', 'showMini', 'tradeableOnly', 'hideRetired']) {
  document.getElementById(id).addEventListener('change', e => { state.filter[id] = e.target.checked; render(); });
}

// ---------- boot ----------
function init() {
  const data = window.QUEST_DATA;
  if (!data) {
    setStatus('data.js is missing. Run fetch_data.py (or wait for the next scheduled deploy).', true);
    return;
  }
  try {
    state.quests = parseQuestHtml(data.listHtml);
    state.items = data.items || [];
    linkItems();
  } catch (e) {
    setStatus('Could not read data.js: ' + e.message, true);
    return;
  }
  for (const name of PLAYERS) {
    ingestPlayer(name, (data.players || {})[name], (data.stats || {})[name]);
  }
  state.skills = collectSkills();
  const reqs = new Map(Object.entries(data.reqs || {}).map(([k, v]) => [norm(k), v]));
  for (const q of state.quests) q.reqs = reqs.get(norm(q.page)) || [];
  const nq = state.quests.filter(q => q.type === 'quest').length;
  const unlinked = state.items.flatMap(it => it.needed).filter(n => !n.quest).length;
  setStatus(`${nq} quests, ${state.quests.length - nq} miniquests, ${state.items.length} items. Data fetched ${new Date(data.fetchedAt).toLocaleString()}.`
    + (unlinked ? ` ${unlinked} item→quest links could not be matched.` : ''));
  try { setView(localStorage.getItem('view') || state.view); } catch (e) { /* storage blocked */ }
  renderPlayers();
  render();
}
init();
</script>
</body>
