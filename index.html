<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSRS quest tracker</title>
<style>
  :root {
    --bg: #f7f5ef;
    --paper: #ffffff;
    --ink: #1f1d18;
    --muted: #6d675c;
    --line: #dcd6c8;
    --ok: #2e7d32;
    --ok-bg: #e4f2e5;
    --mid: #b26a00;
    --mid-bg: #fff1d6;
    --no: #b23a2e;
    --no-bg: #f9e4e1;
    --unk: #9a948a;
    --unk-bg: #eeebe3;
    --accent: #3b4f8a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.4 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { padding: 20px 24px 12px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  .players { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
    background: var(--paper); border: 1px solid var(--line); cursor: pointer; }
  .chip b { font-weight: 600; }
  .chip .count { color: var(--muted); font-variant-numeric: tabular-nums; }
  .chip.error { border-color: var(--no); color: var(--no); }
  .chip.loading { color: var(--muted); }
  .controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 0 24px 12px; }
  .controls input[type=search] { padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; min-width: 220px; font: inherit; }
  .controls label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  button { font: inherit; padding: 6px 12px; border: 1px solid var(--line); background: var(--paper); border-radius: 6px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  #status { padding: 0 24px 12px; color: var(--muted); }
  #status .err { color: var(--no); }

  .wrap { padding: 0 24px 40px; overflow-x: auto; }
  table { border-collapse: collapse; background: var(--paper); border: 1px solid var(--line); width: 100%; }
  th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--paper); cursor: pointer; user-select: none; font-weight: 600; z-index: 1; }
  th:hover { color: var(--accent); }
  th .dir { color: var(--accent); margin-left: 4px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.st, th.st { text-align: center; }
  td a { color: var(--ink); text-decoration: none; }
  td a:hover { text-decoration: underline; }
  tr.mini td:first-child { color: var(--muted); }
  .mark { display: inline-block; min-width: 26px; padding: 1px 6px; border-radius: 4px; font-weight: 600; }
  .m2 { color: var(--ok); background: var(--ok-bg); }
  .m1 { color: var(--mid); background: var(--mid-bg); }
  .m0 { color: var(--no); background: var(--no-bg); }
  .mx { color: var(--unk); background: var(--unk-bg); }
  tr.all-done td { opacity: .55; }

  dialog { border: 1px solid var(--line); border-radius: 8px; padding: 20px; max-width: 640px; width: calc(100% - 40px); }
  dialog textarea { width: 100%; height: 160px; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; margin: 10px 0; }
  dialog code { background: var(--bg); padding: 2px 5px; border-radius: 4px; word-break: break-all; }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; }
  .legend { color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
</style>
</head>
<body>

<header>
  <h1>OSRS quest tracker</h1>
  <div class="players" id="players"></div>
  <button id="reload">Reload all</button>
</header>

<div class="controls">
  <input type="search" id="q" placeholder="Filter by quest name">
  <label><input type="checkbox" id="hideDone"> Hide quests everyone finished</label>
  <label><input type="checkbox" id="showMini" checked> Include miniquests</label>
  <span class="legend">
    <span><span class="mark m2">✓</span> done</span>
    <span><span class="mark m1">◐</span> in progress</span>
    <span><span class="mark m0">✗</span> not started</span>
    <span><span class="mark mx">–</span> no data</span>
  </span>
</div>

<div id="status">Loading quest list…</div>

<div class="wrap">
  <table id="table"></table>
</div>

<dialog id="pasteDialog">
  <h3 style="margin:0">Load data for <span id="pasteName"></span> manually</h3>
  <p>Open this URL in a new tab, copy everything on the page, and paste it below:</p>
  <p><code id="pasteUrl"></code></p>
  <textarea id="pasteBox" placeholder="{ &quot;username&quot;: ..., &quot;quests&quot;: { ... } }"></textarea>
  <div class="row">
    <button id="pasteCancel">Cancel</button>
    <button id="pasteSave">Use this data</button>
  </div>
</dialog>

<!-- Generated by fetch_data.py. If missing, the page falls back to live fetching. -->
<script src="data.js"></script>
<script>
// ---------- config ----------
const PLAYERS = ['gaudyk', 'uncle sacks', 'Moms klit', 'knysliukas', 'cluescrollas'];
const WIKI_API = 'https://oldschool.runescape.wiki/api.php';
const WIKI_BASE = 'https://oldschool.runescape.wiki';
const SYNC_API = 'https://sync.runescape.wiki/runelite/player';

const DIFFICULTY = ['Novice', 'Intermediate', 'Experienced', 'Master', 'Grandmaster', 'Special'];
const LENGTH = ['Very Short', 'Short', 'Medium', 'Long', 'Very Long'];

// ---------- state ----------
const state = {
  quests: [],        // { name, url, type: 'quest'|'miniquest', members, difficulty, length, qp, series, release }
  players: {},       // name -> { status: 'loading'|'ok'|'error', error, quests: { normName -> 0|1|2 } }
  sort: { key: 'done', dir: -1 },
  filter: { q: '', hideDone: false, showMini: true },
};

const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------- quest list from the wiki ----------
async function fetchQuestList() {
  const url = `${WIKI_API}?action=parse&page=Quests/List&prop=text&formatversion=2&format=json&origin=*`;
  let res;
  try {
    res = await fetch(url);
  } catch (e) {
    const hint = location.protocol === 'file:'
      ? ' You opened this file directly (file://), so the browser sends no usable origin and the wiki rejects the request. Run fetch_data.py to generate data.js, or serve the folder with "python3 -m http.server" and open http://localhost:8000/osrs-quests.html.'
      : '';
    throw new Error(e.message + hint);
  }
  if (!res.ok) throw new Error(`Wiki API returned HTTP ${res.status}`);
  const json = await res.json();
  return parseQuestHtml(json.parse.text);
}

function parseQuestHtml(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');

  const quests = [];
  let questTables = 0;

  for (const table of doc.querySelectorAll('table.wikitable')) {
    const rows = [...table.querySelectorAll('tr')];
    if (!rows.length) continue;
    const headCells = [...rows[0].children];
    const heads = headCells.map(th => th.textContent.trim());
    const col = label => heads.findIndex(h => h.toLowerCase().startsWith(label.toLowerCase()));

    const iName = col('Name');
    if (iName < 0) continue; // classification tables etc.
    const iDiff = col('Difficulty'), iLen = col('Length'), iSeries = col('Series'), iRel = col('Release');
    const iQp = headCells.findIndex(th => th.querySelector('img[alt*="Quest point" i], a[title="Quest points"]'));
    const isQuest = col('#') === 0;
    const members = isQuest ? questTables++ > 0 : true; // 1st quest table is F2P, 2nd is members

    for (const tr of rows.slice(1)) {
      const td = [...tr.children];
      if (td.length <= iName) continue;
      const link = td[iName].querySelector('a');
      const name = td[iName].textContent.trim();
      if (!name) continue;
      quests.push({
        name,
        url: link ? WIKI_BASE + link.getAttribute('href') : '',
        type: isQuest ? 'quest' : 'miniquest',
        members,
        difficulty: iDiff >= 0 ? td[iDiff].textContent.trim() : '',
        length: iLen >= 0 ? td[iLen].textContent.trim() : '',
        qp: iQp >= 0 ? parseInt(td[iQp].textContent.trim(), 10) || 0 : 0,
        series: iSeries >= 0 ? td[iSeries].textContent.trim() : '',
        release: iRel >= 0 ? td[iRel].textContent.trim() : '',
      });
    }
  }
  if (!quests.length) throw new Error('No quest tables found on the wiki page (layout changed?)');
  return quests;
}

// ---------- player data from WikiSync ----------
function playerUrl(name) { return `${SYNC_API}/${encodeURIComponent(name)}/STANDARD`; }

function ingestPlayerJson(name, data) {
  const map = {};
  for (const [k, v] of Object.entries(data.quests || {})) map[norm(k)] = v;
  state.players[name] = { status: 'ok', quests: map, raw: data };
  try { localStorage.setItem('osrsq:' + name, JSON.stringify(data)); } catch (_) {}
}

async function fetchPlayer(name) {
  state.players[name] = { status: 'loading' };
  renderPlayers();
  try {
    const res = await fetch(playerUrl(name));
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    ingestPlayerJson(name, await res.json());
  } catch (e) {
    // Fall back to data pasted earlier, if any
    let cached = null;
    try { cached = JSON.parse(localStorage.getItem('osrsq:' + name)); } catch (_) {}
    if (cached) {
      ingestPlayerJson(name, cached);
      state.players[name].stale = true;
    } else {
      state.players[name] = { status: 'error', error: e.message || String(e) };
    }
  }
  renderPlayers();
  renderTable();
}

// status of one quest for one player: 2 done, 1 in progress, 0 not started, -1 no data
function questStatus(quest, playerName) {
  const p = state.players[playerName];
  if (!p || p.status !== 'ok') return -1;
  const v = p.quests[norm(quest.name)];
  return v === undefined ? -1 : v;
}
function doneCount(quest) {
  return PLAYERS.reduce((n, p) => n + (questStatus(quest, p) === 2 ? 1 : 0), 0);
}

// ---------- rendering ----------
function renderPlayers() {
  const total = state.quests.filter(q => q.type === 'quest').length;
  document.getElementById('players').innerHTML = PLAYERS.map(name => {
    const p = state.players[name] || {};
    let cls = 'chip', extra = '';
    if (p.status === 'loading') { cls += ' loading'; extra = '…'; }
    else if (p.status === 'error') { cls += ' error'; extra = 'failed – click to paste'; }
    else if (p.status === 'ok') {
      const done = state.quests.filter(q => q.type === 'quest' && questStatus(q, name) === 2).length;
      extra = `${done}/${total}` + (p.stale ? ' (pasted)' : '');
    }
    return `<span class="${cls}" data-name="${esc(name)}" title="${esc(p.error || 'Click to load data manually')}"><b>${esc(name)}</b><span class="count">${esc(extra)}</span></span>`;
  }).join('');
}

const COLUMNS = [
  { key: 'name', label: 'Quest' },
  { key: 'difficulty', label: 'Difficulty' },
  { key: 'length', label: 'Length' },
  { key: 'qp', label: 'QP', cls: 'num' },
  { key: 'done', label: 'Done by', cls: 'num' },
  ...PLAYERS.map((p, i) => ({ key: 'p' + i, label: p, cls: 'st' })),
];

function sortValue(q, key) {
  switch (key) {
    case 'name': return q.name.toLowerCase();
    case 'difficulty': return DIFFICULTY.indexOf(q.difficulty);
    case 'length': return LENGTH.indexOf(q.length);
    case 'qp': return q.qp;
    case 'done': return doneCount(q);
    default: return questStatus(q, PLAYERS[+key.slice(1)]);
  }
}

function sortedFilteredQuests() {
  const { q, hideDone, showMini } = state.filter;
  const needle = q.trim().toLowerCase();
  const list = state.quests.filter(x =>
    (showMini || x.type === 'quest') &&
    (!needle || x.name.toLowerCase().includes(needle)) &&
    (!hideDone || doneCount(x) < PLAYERS.length)
  );
  const { key, dir } = state.sort;
  return list.sort((a, b) => {
    const va = sortValue(a, key), vb = sortValue(b, key);
    let c = va < vb ? -1 : va > vb ? 1 : 0;
    if (c === 0 && key !== 'done') c = doneCount(b) - doneCount(a);
    if (c === 0) c = a.name.localeCompare(b.name);
    return c * dir;
  });
}

const MARK = { 2: ['m2', '✓', 'Completed'], 1: ['m1', '◐', 'In progress'], 0: ['m0', '✗', 'Not started'], '-1': ['mx', '–', 'No data'] };

function renderTable() {
  const { key, dir } = state.sort;
  const head = COLUMNS.map(c =>
    `<th class="${c.cls || ''}" data-key="${c.key}">${esc(c.label)}${c.key === key ? `<span class="dir">${dir > 0 ? '▲' : '▼'}</span>` : ''}</th>`
  ).join('');

  const rows = sortedFilteredQuests().map(q => {
    const done = doneCount(q);
    const cells = PLAYERS.map(p => {
      const [cls, sym, title] = MARK[questStatus(q, p)];
      return `<td class="st"><span class="mark ${cls}" title="${title}">${sym}</span></td>`;
    }).join('');
    const rowCls = [q.type === 'miniquest' ? 'mini' : '', done === PLAYERS.length ? 'all-done' : ''].join(' ').trim();
    const nameCell = q.url ? `<a href="${esc(q.url)}" target="_blank" rel="noopener">${esc(q.name)}</a>` : esc(q.name);
    return `<tr class="${rowCls}">
      <td>${nameCell}${q.type === 'miniquest' ? ' <small>(miniquest)</small>' : ''}</td>
      <td>${esc(q.difficulty)}</td>
      <td>${esc(q.length)}</td>
      <td class="num">${q.type === 'quest' ? q.qp : ''}</td>
      <td class="num">${done}/${PLAYERS.length}</td>
      ${cells}
    </tr>`;
  }).join('');

  document.getElementById('table').innerHTML = `<thead><tr>${head}</tr></thead><tbody>${rows}</tbody>`;
}

function setStatus(msg, isError) {
  document.getElementById('status').innerHTML = isError ? `<span class="err">${esc(msg)}</span>` : esc(msg);
}

// ---------- events ----------
document.getElementById('table').addEventListener('click', e => {
  const th = e.target.closest('th');
  if (!th) return;
  const key = th.dataset.key;
  if (state.sort.key === key) state.sort.dir *= -1;
  else state.sort = { key, dir: key === 'name' || key === 'difficulty' || key === 'length' ? 1 : -1 };
  renderTable();
});

document.getElementById('q').addEventListener('input', e => { state.filter.q = e.target.value; renderTable(); });
document.getElementById('hideDone').addEventListener('change', e => { state.filter.hideDone = e.target.checked; renderTable(); });
document.getElementById('showMini').addEventListener('change', e => { state.filter.showMini = e.target.checked; renderTable(); });
document.getElementById('reload').addEventListener('click', init);

// manual paste fallback
let pasteTarget = null;
document.getElementById('players').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  pasteTarget = chip.dataset.name;
  document.getElementById('pasteName').textContent = pasteTarget;
  document.getElementById('pasteUrl').textContent = playerUrl(pasteTarget);
  document.getElementById('pasteBox').value = '';
  document.getElementById('pasteDialog').showModal();
});
document.getElementById('pasteCancel').addEventListener('click', () => document.getElementById('pasteDialog').close());
document.getElementById('pasteSave').addEventListener('click', () => {
  try {
    const data = JSON.parse(document.getElementById('pasteBox').value);
    if (!data.quests) throw new Error('JSON has no "quests" field');
    ingestPlayerJson(pasteTarget, data);
    state.players[pasteTarget].stale = true;
    document.getElementById('pasteDialog').close();
    renderPlayers();
    renderTable();
  } catch (err) {
    alert('Could not read that: ' + err.message);
  }
});

// ---------- boot ----------
async function init() {
  const local = window.QUEST_DATA;
  setStatus(local ? 'Reading data.js…' : 'Loading quest list from the wiki…');
  try {
    state.quests = local ? parseQuestHtml(local.listHtml) : await fetchQuestList();
    const nq = state.quests.filter(q => q.type === 'quest').length;
    const src = local ? `From data.js, fetched ${new Date(local.fetchedAt).toLocaleString()}.` : 'Live from the wiki.';
    setStatus(`${nq} quests, ${state.quests.length - nq} miniquests. ${src} Click a column header to sort.`);
  } catch (e) {
    setStatus('Could not load the quest list: ' + e.message, true);
    return;
  }
  renderPlayers();
  renderTable();

  if (local) {
    for (const name of PLAYERS) {
      const data = local.players && local.players[name];
      if (data && data.quests) ingestPlayerJson(name, data);
      else state.players[name] = { status: 'error', error: 'Not in data.js (fetch_data.py could not load this player)' };
    }
    renderPlayers();
    renderTable();
  } else {
    await Promise.all(PLAYERS.map(fetchPlayer));
  }
}
init();
</script>
</body>
</html>
