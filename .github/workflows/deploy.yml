name: Fetch data and deploy
 
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:        # manual "Run workflow" button
  push:
    branches: [main]
 
permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: pages
  cancel-in-progress: true
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch quest list and player data
        run: python3 fetch_data.py
      - name: Assemble site
        run: |
          mkdir -p public
          cp index.html data.js public/
          cp -r assets public/
          # unique data.js URL per deploy, so a cached copy can never be paired with a newer index.html
          sed -i "s|src=\"data.js\"|src=\"data.js?v=${GITHUB_RUN_ID}\"|" public/index.html
          grep -o 'data.js?v=[0-9]*' public/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
 
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
 
